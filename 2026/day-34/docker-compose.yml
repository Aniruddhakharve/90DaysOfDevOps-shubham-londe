services:
  web:
    build: /root/90DaysOfDevOps-shubham-londe/2026/day-34/app/.
      #  context: .
    ports:
      - 8060:5000
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    labels:
      project: "day_34"
      services: "web"
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 3307:3306
    networks:
      - app-network
    labels: 
      project: "day-34"
      service: "database"
  redis:
    image: redis:alpine
    networks:
      - app-network
    labels:
      project: "day-34"
      service:  "cache"
networks:
  app-network:
    name: day34-app-network
    driver: bridge
volumes:
  mysql-data:
    name: day34-mysql-data

