apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-pod
spec:
  containers:
    - name: ephemeral-container
      image: busybox
      command:
        - sh
        - -c
        - "date > /data/message.txt && echo 'Message written successfully' && sleep 3600"
      volumeMounts:
        - name: temporary-storage
          mountPath: /data
  volumes:
    - name: temporary-storage
      emptyDir: {}