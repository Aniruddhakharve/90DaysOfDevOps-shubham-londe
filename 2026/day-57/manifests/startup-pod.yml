apiVersion: v1
kind: Pod
metadata:
  name: startup-pod
spec: 
  containers:
    - name: busybox
      image: busybox:latest
      command:
        - sh
        - -c
        - "sleep 20 && touch /tmp/started && sleep 3600"
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/started
        failureThreshold: 12
        periodSeconds: 5
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/started
        failureThreshold: 3
        periodSeconds: 5