name: Upload Artifact

on:
  workflow_dispatch:

jobs:
    generate-support:
        runs-on: ubuntu-latest
        steps:
            - name: Generate test report
              run: |
                 echo "Test Report" >> test-report.txt
                 echo "Status: PASS" >> test-report.txt
                 echo "Generated by GitHub Actions: $(date)" >> test-report.txt

            - name: Display report
              run: cat test-report.txt

            - name: upload test report as artifact
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: test-report.txt