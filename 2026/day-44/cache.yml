name:  Cache Demo

on:
  workflow_dispatch:

jobs:
    cache-demo:
        runs-on: ubuntu-latest
        steps:
            - name: Restore cache
              id: cache
              uses: actions/cache@v4
              with:
                path: cache-data
                key: demo-cache-v1

            - name: Show cache status
              run: |
                 if [  "${{steps.cache.outputs.cache-hit}}" = "true" ]; then
                    echo "Cache hit! Data was restored from the cache."
                 else
                    echo "Cache miss! No existing cache was found."
                 fi

            - name: generate data
              run: |
                 mkdir -p cache-data
                 echo "This data was generated during First Run" >> cache-data/result.txt
                 echo "Cache demonstration completed" >> cache-data/result.txt

            - name: show cache data
              run: |
                    echo "Cache data content:"
                    cat cache-data/result.txt 

