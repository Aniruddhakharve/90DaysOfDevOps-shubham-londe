name: Artifact Between Jobs

on:
    workflow_dispatch:


jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: Generate file
              run: |
                 echo  "Artifact generated by Job 1" >> pipelineoutput.txt
                 echo  "This file will be used by Job 2" >> pipelineoutput.txt

            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: pipeline-output
                path: pipelineoutput.txt

    use-artifact:
        runs-on: ubuntu-latest
        needs: generate
        steps:
            - name: download artifact
              uses: actions/download-artifact@v4
              with:
                name: pipeline-output

            - name: Display artifact content
              run: | 
                 cat pipelineoutput.txt