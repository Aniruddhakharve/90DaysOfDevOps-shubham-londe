apiVersion: v1
kind: Service
metadata:
  name: web-app-nodeport

spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - protocol: TCP
    port: 80 #service port in k8s 
    targetPort: 80  #pods port in k8s  service----> pods
    nodePort: 30080 #port to access the service from outside the cluster
  